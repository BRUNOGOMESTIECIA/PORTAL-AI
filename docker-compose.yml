networks:
  portal_net:
    driver: bridge

volumes:
  postgres_master_data:
  redis_data:
  minio_data:
  traefik_certs:
  vite_cache:     # Persiste o dep pre-bundling do Vite entre restarts

services:
  # ─── Reverse Proxy ────────────────────────────────────────────────────────────
  # Em dev local use: docker compose up  (Traefik não sobe, acesse via localhost:PORT)
  # Em produção use:  docker compose --profile prod up
  traefik:
    image: traefik:v3.2
    container_name: portal_traefik
    profiles: ["prod"]
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      # Wildcard cert via DNS challenge (configure DNS provider)
      # - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      # - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard (restrict in production)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/certs"
    networks:
      - portal_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${APP_DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MASTER_DB_USER}
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD}
      POSTGRES_DB: ${MASTER_DB_NAME}
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - portal_net
    ports:
      - "5432:5432"    # Remove in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MASTER_DB_USER} -d ${MASTER_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: portal_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - portal_net
    ports:
      - "6379:6379"    # Remove in production
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  # ─── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: portal_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - portal_net
    ports:
      - "9000:9000"   # API (Remove in production, route through Traefik)
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`storage.${APP_DOMAIN}`)"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"

  # ─── MinIO bucket initializer (one-shot, exits 0 on success) ─────────────────
  minio-init:
    image: minio/mc:latest
    container_name: portal_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://$$MINIO_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        mc anonymous set none local/$$MINIO_BUCKET;
        exit 0;
      "
    networks:
      - portal_net

  # ─── Backend API (NestJS) ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: portal_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: ${APP_PORT:-3000}
      APP_DOMAIN: ${APP_DOMAIN}
      MASTER_DB_HOST: postgres
      MASTER_DB_PORT: 5432
      MASTER_DB_NAME: ${MASTER_DB_NAME}
      MASTER_DB_USER: ${MASTER_DB_USER}
      MASTER_DB_PASSWORD: ${MASTER_DB_PASSWORD}
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: 5432
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PRESIGNED_TTL: ${MINIO_PRESIGNED_TTL:-3600}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-10000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS}
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
    networks:
      - portal_net
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    labels:
      - "traefik.enable=true"
      # API route: api.empresa.com.br
      - "traefik.http.routers.api.rule=Host(`api.${APP_DOMAIN}`)"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=${APP_PORT:-3000}"
      # Wildcard subdomain → API (for multi-tenant subdomain routing)
      - "traefik.http.routers.api-tenants.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${APP_DOMAIN}`)"
      - "traefik.http.routers.api-tenants.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-tenants.service=api"
      - "traefik.http.routers.api-tenants.priority=1"

  # ─── Frontend Web (Vite + React) ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: ${NODE_ENV:-development}
    container_name: portal_web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: https://api.${APP_DOMAIN}
      VITE_APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
      - vite_cache:/app/apps/web/node_modules/.vite
    networks:
      - portal_net
    ports:
      - "5173:5173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.${APP_DOMAIN}`)"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=5173"
