[project]
name = "api"
version = "0.1.0"
description = "Backend SaaS Portal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "pydantic>=2.7.2",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.4",
    "celery>=5.4.0",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.3",
    "langchain-google-genai>=4.2.2",
    "google-genai>=1.75.0",
    "pymupdf>=1.27.2.3",
    "langchain>=1.3.1",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.12.0",
    "python-multipart>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_portal"]
